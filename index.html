<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夜班自主檢查確認系統</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body { 
            font-family: "Microsoft JhengHei", sans-serif; 
            background-color: #f4f4f9; 
            padding: 10px; 
            margin: 0;
            user-select: none; 
            -webkit-user-select: none;
        }
        
        .container { position: relative; width: 100%; max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); overflow: hidden; }
        h1, h2 { text-align: center; color: #333; }
        
        .test-mode-btn { position: absolute; top: 10px; right: 10px; padding: 4px 8px; font-size: 11px; background-color: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; opacity: 0.8; z-index: 100; }
        .test-mode-btn:hover { background-color: #5a6268; opacity: 1; }
        .test-mode-btn.active { background-color: #28a745; opacity: 1; }
        .test-mode-btn.active:hover { background-color: #218838; }
        .test-mode-btn:disabled { background-color: #aaa; cursor: not-allowed; opacity: 1;}

        #violation-warnings { color: red; font-size: 20px; font-weight: bold; text-align: center; margin-bottom: 20px; margin-top: 35px; min-height: 25px; }
        
        /* 表單區塊 */
        .form-group { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; width: 100%; }
        select, .operator-display, button.submit-btn { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; max-width: 100%; }
        /* 綁定後的姓名顯示區塊 */
        .operator-display { background-color: #e9ecef; font-weight: bold; color: #007bff; display: flex; align-items: center; justify-content: center; border: 1px solid #ccc; }
        
        button.submit-btn { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; width: 100%; max-width: 250px; }
        button.submit-btn:hover { background-color: #0056b3; }
        button.submit-btn:disabled { background-color: #a0c4ff; cursor: not-allowed; }

        .status-board-container { margin-top: 30px; width: 100%; }
        .date-selector { text-align: center; margin-bottom: 20px; background: #e9ecef; padding: 15px; border-radius: 8px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px;}
        .date-selector label { font-size: 16px; font-weight: bold; }
        .date-selector input { padding: 8px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; cursor: pointer; }
        
        .equipment-row { display: flex; align-items: center; margin-bottom: 15px; padding: 10px; background: #f9f9f9; border-radius: 5px; width: 100%; }
        .equipment-name { width: 100px; font-weight: bold; font-size: 18px; flex-shrink: 0; white-space: nowrap; }
        
        .circles-container { display: flex; justify-content: flex-start; gap: 15px; overflow-x: auto; padding-bottom: 5px; width: 100%; }
        .circle-wrapper { display: flex; flex-direction: column; align-items: center; min-width: 45px; flex-shrink: 0; }
        .circle { width: 30px; height: 30px; border-radius: 50%; background-color: #ccc; margin-bottom: 5px; }
        .circle.green { background-color: #28a745; }
        .circle.yellow { background-color: #ffc107; }
        .circle.pink { background-color: #ff69b4; }
        .circle.red { background-color: #dc3545; }
        .time-label { font-size: 12px; color: #555; height: 14px; }

        .history-section { margin-top: 40px; overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: center; min-width: 400px; }
        th, td { border: 1px solid #ddd; padding: 10px; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }

        @media (max-width: 768px) {
            .container { padding: 15px 10px; }
            h1 { font-size: 22px; }
            h2 { font-size: 18px; }
            
            .form-group select, .form-group .operator-display { width: 45%; flex-grow: 1; text-align: center; }
            .form-group select:nth-child(3) { width: 100%; }
            
            .equipment-row { flex-direction: column; align-items: flex-start; padding: 10px; }
            .equipment-name { width: 100%; margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid #ddd; text-align: left; font-size: 16px; }
            
            .circles-container { gap: 2px; justify-content: space-around; padding-bottom: 0px; }
            .circle-wrapper { min-width: 32px; }
            .circle { width: 20px; height: 20px; margin-bottom: 2px; }
            .time-label { font-size: 9px; transform: scale(0.85); transform-origin: top center; }

            /* 優化手機版歷史紀錄表格，使其自動適應螢幕 */
            .history-section { margin-top: 30px; }
            table { min-width: 100%; font-size: 13px; }
            th, td { padding: 6px 2px; word-break: break-word; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<!-- LINE 登入遮罩畫面 -->
<div id="login-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: sans-serif;">
    <h2 style="color: #333; margin-bottom: 20px;">夜班自主檢查系統</h2>
    <p style="color: #666; margin-bottom: 30px;" id="login-hint">向伺服器請求配置中...</p>
    <button id="loginBtn" onclick="liff.login()" style="display:none; padding: 12px 30px; background-color: #06C755; color: white; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        使用 LINE 登入
    </button>
</div>

<!-- 首次登入綁定遮罩畫面 -->
<div id="binding-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 9998; flex-direction: column; justify-content: center; align-items: center; font-family: sans-serif;">
    <h2 style="color: #333; margin-bottom: 20px;">首次登入帳號綁定</h2>
    <p style="color: #dc3545; font-weight: bold; margin-bottom: 20px;">⚠️ 注意：一經綁定將無法自行更改</p>
    <p style="color: #666; margin-bottom: 15px;">請選擇您的姓名以綁定此 LINE 帳號：</p>
    
    <select id="bind-operator" style="padding: 10px; font-size: 16px; border-radius: 5px; margin-bottom: 20px; width: 250px;">
        <option value="">載入名單中...</option>
    </select>
    
    <button id="bindBtn" onclick="bindLineAccount()" style="padding: 12px 30px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        確認綁定
    </button>
</div>

<div class="container">
    <button id="testModeBtn" class="test-mode-btn" onclick="toggleTestMode()">測試人員模式</button>
    
    <div id="violation-warnings"></div>

    <h1>夜班自主檢查確認</h1>
    
    <div class="form-group">
        <div id="operator-display" class="operator-display">
            資料載入中...
        </div>

        <select id="equipment">
            <option value="">-- 選擇設備 --</option>
            <option value="七*機">七*機</option>
            <option value="角*機">角*機</option>
            <option value="六*機">六*機</option>
            <option value="中**機">中**機</option>
            <option value="台*機">台*機</option>
            <option value="薄*機">薄*機</option>
        </select>

        <select id="status">
            <option value="">-- 選擇品質狀態 --</option>
            <option value="品質正常">品質正常</option>
            <option value="可收板,但須微調">可收板,但須微調</option>
            <option value="須暫停收板,調整">須暫停收板,調整</option>
            <option value="需要停機調整">需要停機調整</option>
        </select>

        <button id="submitBtn" class="submit-btn" onclick="submitInspection()">自主檢查確認</button>
    </div>

    <div class="status-board-container">
        <div class="date-selector">
            <label for="view-date">查詢特定日期設備狀態：</label>
            <input type="date" id="view-date" onchange="renderStatusBoard()">
        </div>
        <div id="status-board">
            <h2>載入雲端資料中...請稍候</h2>
        </div>
    </div>

    <div class="history-section">
        <h2>近 50 筆自主檢查紀錄</h2>
        <table>
            <thead>
                <tr>
                    <th>時間</th>
                    <th>人員</th>
                    <th>設備</th>
                    <th>品質狀態</th>
                </tr>
            </thead>
            <tbody id="history-body">
            </tbody>
        </table>
    </div>
</div>

<script>
    // ================== 開發者工具防護機制 ==================
    document.addEventListener('keydown', function (e) {
        if ( e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) || (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j')) || (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) || (e.ctrlKey && (e.key === 'U' || e.key === 'u')) ) {
            e.preventDefault(); return false;
        }
    });
    setInterval(function() { (function() { debugger; })(); }, 1000);
    // ========================================================

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxarx1BWpO2lTskr1ex8DD0pPjZOyJ50VPBU6lXfCPTygkiV0DVreJDXNuXFZsNTsQ-/exec"; 
    
    let DYNAMIC_LIFF_ID = ""; 

    const allOperators = ["王軒嘉", "王茂泉", "楊政嘉", "黃阡汶", "侯志賢", "楊惠堂", "許俊然", "張正義", "阮維慶(NGUYEN DUY KHAMH)", "胡峰旗",  "陳光玲(TRAN QUANG LINH)", "阮文孟(NGUYEN VAN MANH)","陳榮文", "吳文德", "測試1", "測試2"];
    const equipments = ["七*機", "角*機", "六*機", "中**機", "台*機", "薄*機"];
    
    let records = [];
    let isTestMode = false;
    let currentLineId = "";
    let currentUser = ""; 

    // 【新增】遮蔽姓名的函數：把第二個字替換為 "O"
    function maskName(name) {
        if (!name || name.length <= 1) return name || "";
        return name.charAt(0) + "O" + name.substring(2);
    }

    async function toggleTestMode() {
        const btn = document.getElementById("testModeBtn");
        if (isTestMode) {
            isTestMode = false;
            btn.innerText = "測試人員模式";
            btn.classList.remove("active");
            alert("已關閉測試模式，恢復正常時間限制。");
        } else {
            const pwd = prompt("請輸入測試人員密碼：");
            if (pwd !== null && pwd !== "") {
                btn.innerText = "驗證中...";
                btn.disabled = true;
                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'verify_password', password: pwd })
                    });
                    const data = await res.json();
                    
                    if (data.result === "success") {
                        isTestMode = true;
                        btn.innerText = "測試模式 (已開啟)";
                        btn.classList.add("active");
                        alert("✅ 測試模式已開啟！\n(已解除非夜班時段與半小時檢查間隔限制)");
                    } else {
                        alert("❌ 密碼錯誤");
                        btn.innerText = "測試人員模式";
                    }
                } catch (error) {
                    alert("驗證連線失敗，請檢查網路！");
                    btn.innerText = "測試人員模式";
                } finally {
                    btn.disabled = false;
                }
            }
        }
    }

    function initDatePicker() {
        const date = new Date();
        if (date.getHours() >= 8) { date.setDate(date.getDate()); }
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        document.getElementById("view-date").value = `${yyyy}-${mm}-${dd}`;
    }

    function getLastRecord(equip) {
        let equipRecords = records.filter(r => r.equipment === equip);
        return equipRecords.length > 0 ? equipRecords[equipRecords.length - 1] : null;
    }

    // 載入資料 (包含打單紀錄 與 綁定名單)
    async function loadData() {
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            
            records = data.records || [];
            let bindings = data.bindings || {};

            if (bindings[currentLineId]) {
                currentUser = bindings[currentLineId];
                // 顯示隱藏後的姓名
                document.getElementById("operator-display").innerText = "👤 " + maskName(currentUser);
                document.getElementById("login-overlay").style.display = "none";
                document.getElementById("binding-overlay").style.display = "none";
                updateUI();
            } else {
                document.getElementById("login-overlay").style.display = "none";
                const boundNames = Object.values(bindings);
                const availableOperators = allOperators.filter(name => !boundNames.includes(name));
                
                const bindSelect = document.getElementById("bind-operator");
                bindSelect.innerHTML = '<option value="">-- 請選擇您的姓名 --</option>';
                
                if (availableOperators.length === 0) {
                    bindSelect.innerHTML = '<option value="">無可用名單，請聯繫主管</option>';
                } else {
                    availableOperators.forEach(name => {
                        const opt = document.createElement("option");
                        opt.value = name; // 後台紀錄傳送真實姓名
                        opt.innerText = maskName(name); // 下拉選單顯示隱藏後的姓名
                        bindSelect.appendChild(opt);
                    });
                }
                document.getElementById("binding-overlay").style.display = "flex";
            }
        } catch (error) {
            console.error("載入失敗", error);
            alert("載入資料失敗，請檢查網路連線。");
            document.getElementById("status-board").innerHTML = "<h2 style='color:red;'>載入失敗，請重新整理</h2>";
        }
    }

    // 執行首次綁定動作
    async function bindLineAccount() {
        const selectedName = document.getElementById("bind-operator").value; // 抓取真實姓名
        if (!selectedName) {
            alert("請選擇您的姓名！");
            return;
        }
        
        const btn = document.getElementById("bindBtn");
        btn.innerText = "綁定中...";
        btn.disabled = true;
        
        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'bind',
                    lineId: currentLineId,
                    name: selectedName
                })
            });
            
            alert(`✅ 成功綁定為：${maskName(selectedName)}`);
            
            currentUser = selectedName;
            // 顯示隱藏後的姓名
            document.getElementById("operator-display").innerText = "👤 " + maskName(currentUser);
            document.getElementById("binding-overlay").style.display = "none";
            updateUI(); 
            
        } catch (error) {
            console.error("綁定失敗", error);
            alert("綁定失敗，請稍後再試。");
            btn.innerText = "確認綁定";
            btn.disabled = false;
        }
    }

    // 提交自主檢查確認
    async function submitInspection() {
        const now = new Date();
        
        if (!isTestMode && now.getHours() >= 8) {
            alert("目前非夜班時段");
            return;
        }

        const equipment = document.getElementById("equipment").value;
        const status = document.getElementById("status").value;

        if (!currentUser || !equipment || !status) {
            alert("有項目未選取或尚未綁定帳號！");
            return;
        }

        const lastRecord = getLastRecord(equipment);

        if (!isTestMode && lastRecord) {
            const lastTime = new Date(lastRecord.timestamp);
            const diffHours = (now - lastTime) / (1000 * 30 * 60);

            if (diffHours < 1) {
                const timeString = lastTime.toLocaleTimeString('zh-TW', { hour12: false });
                alert(`還沒滿半小時,請勿按按鈕: ${timeString}`);
                return;
            }
        }

        const newRecord = {
            action: 'inspect', 
            timestamp: now.getTime(),
            date: now.toLocaleDateString('zh-TW'),
            operator: currentUser, // 傳送給後端儲存真實姓名
            equipment: equipment,
            status: status
        };

        const btn = document.getElementById("submitBtn");
        btn.innerText = "資料上傳中...";
        btn.disabled = true;

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(newRecord)
            });

            records.push(newRecord);
            updateUI();

            document.getElementById("equipment").value = "";
            document.getElementById("status").value = "";

            alert("✅ 自主檢查已成功紀錄至雲端！");
        } catch (error) {
            console.error("上傳失敗", error);
            alert("資料上傳失敗，請稍後再試。");
        } finally {
            btn.innerText = "自主檢查確認";
            btn.disabled = false;
        }
    }

    function updateUI() {
        renderStatusBoard();
        renderHistory();
        checkDailyAudit();
    }

    function renderStatusBoard() {
        const board = document.getElementById("status-board");
        board.innerHTML = ""; 
        const viewDateInput = document.getElementById("view-date").value;
        let targetDateStr, displayTitleDate;

        if (viewDateInput) {
            let [y, m, d] = viewDateInput.split('-');
            targetDateStr = new Date(y, m - 1, d).toLocaleDateString('zh-TW');
            displayTitleDate = `${y}/${m}/${d}`;
        } else {
            targetDateStr = new Date().toLocaleDateString('zh-TW');
            displayTitleDate = "今日";
        }

        const title = document.createElement("h2");
        title.innerText = `${displayTitleDate} 各設備自檢狀態 (00:00 - 08:00)`;
        board.appendChild(title);

        equipments.forEach(equip => {
            let targetRecords = records.filter(r => {
                let rDate = new Date(r.timestamp);
                return r.date === targetDateStr && r.equipment === equip && (isTestMode || rDate.getHours() < 8);
            });

            const row = document.createElement("div");
            row.className = "equipment-row";
            const nameDiv = document.createElement("div");
            nameDiv.className = "equipment-name";
            nameDiv.innerText = equip;
            row.appendChild(nameDiv);

            const circlesDiv = document.createElement("div");
            circlesDiv.className = "circles-container";

            for (let i = 0; i < 6; i++) {
                const wrapper = document.createElement("div");
                wrapper.className = "circle-wrapper";
                const circle = document.createElement("div");
                circle.className = "circle";
                const timeLabel = document.createElement("div");
                timeLabel.className = "time-label";

                if (i < targetRecords.length) {
                    const rec = targetRecords[i];
                    let rTime = new Date(rec.timestamp);
                    timeLabel.innerText = rTime.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });

                    if (rec.status === "品質正常") circle.classList.add("green");
                    else if (rec.status === "可收板,但須微調") circle.classList.add("yellow");
                    else if (rec.status === "須暫停收板,調整") circle.classList.add("pink");
                    else if (rec.status === "需要停機調整") circle.classList.add("red");
                }
                wrapper.appendChild(circle);
                wrapper.appendChild(timeLabel);
                circlesDiv.appendChild(wrapper);
            }
            row.appendChild(circlesDiv);
            board.appendChild(row);
        });
    }

    function renderHistory() {
        const tbody = document.getElementById("history-body");
        tbody.innerHTML = "";
        const recentRecords = [...records].reverse().slice(0, 50);

        recentRecords.forEach(rec => {
            const tr = document.createElement("tr");
            const rTime = new Date(rec.timestamp).toLocaleString('zh-TW', { hour12: false });

            let statusColor = "#000";
            if (rec.status === "需要停機調整") statusColor = "red";
            else if (rec.status === "須暫停收板,調整") statusColor = "#ff69b4";
            else if (rec.status === "可收板,但須微調") statusColor = "#d39e00";
            else if (rec.status === "品質正常") statusColor = "green";

            tr.innerHTML = `
                <td>${rTime}</td>
                <td>${maskName(rec.operator)}</td> <!-- 這裡隱藏表格中的姓名 -->
                <td>${rec.equipment}</td>
                <td style="color: ${statusColor}; font-weight: bold;">${rec.status}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function checkDailyAudit() {
        const warningDiv = document.getElementById("violation-warnings");
        warningDiv.innerHTML = "";

        const now = new Date();
        if (now.getHours() < 8 || (now.getHours() === 8 && now.getMinutes() < 20)) return;
        const dayOfWeek = now.getDay();
        if (dayOfWeek === 0 || dayOfWeek === 1) return;

        const todayStr = now.toLocaleDateString('zh-TW');
        let allMorningRecords = records.filter(r => r.date === todayStr && new Date(r.timestamp).getHours() < 8);

        if (allMorningRecords.length === 0) {
            const msg = document.createElement("div");
            msg.style.color = "gray"; 
            msg.innerText = `${todayStr} 未有自檢紀錄`;
            warningDiv.appendChild(msg);
            return; 
        }

        equipments.forEach(equip => {
            let targetRecords = records.filter(r => r.date === todayStr && r.equipment === equip && new Date(r.timestamp).getHours() < 8);

            if (targetRecords.length > 0) {
                let isViolation = false;
                if (targetRecords.length < 5) {
                    isViolation = true;
                } else {
                    targetRecords.sort((a, b) => a.timestamp - b.timestamp);
                    for (let i = 1; i < targetRecords.length; i++) {
                        if ((targetRecords[i].timestamp - targetRecords[i - 1].timestamp) > 1.5 * 60 * 60 * 1000) {
                            isViolation = true;
                            break;
                        }
                    }
                }

                if (isViolation) {
                    let violationOperator = targetRecords[targetRecords.length - 1].operator;
                    const msg = document.createElement("div");
                    msg.style.color = "red";
                    // 這裡隱藏違規警報中的姓名
                    msg.innerText = `${equip} ${maskName(violationOperator)} ${todayStr} 在早上0點到8點未確實實施自主檢查`;
                    warningDiv.appendChild(msg);
                }
            }
        });
    }

    window.onload = async function() {
        try {
            document.getElementById("login-hint").innerText = "向伺服器請求配置中...";
            
            const configRes = await fetch(SCRIPT_URL + "?action=getConfig");
            const config = await configRes.json();
            DYNAMIC_LIFF_ID = config.liffId;

            document.getElementById("login-hint").innerText = "系統驗證中，請稍候...";
            
            await liff.init({ liffId: DYNAMIC_LIFF_ID });
            
            if (liff.isLoggedIn()) {
                const profile = await liff.getProfile();
                currentLineId = profile.userId;
                
                initDatePicker();
                await loadData();
            } else {
                document.getElementById("login-hint").innerText = "請先驗證身分以進入系統";
                document.getElementById("loginBtn").style.display = "block";
            }
        } catch (error) {
            console.error("初始化失敗", error);
            document.getElementById("login-hint").innerText = "伺服器連線失敗或配置異常。";
        }
    };

    setInterval(checkDailyAudit, 60000);

</script>

</body>
</html>
