<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夜班自主檢查確認系統</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body { 
            font-family: "Microsoft JhengHei", Arial, sans-serif; 
            background-color: #f4f4f9; 
            padding: 10px; 
            margin: 0;
            user-select: none; 
            -webkit-user-select: none;
        }
        
        .container { position: relative; width: 100%; max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); overflow: hidden; }
        h1, h2 { text-align: center; color: #333; }
        
        /* 語言切換選單 */
        .lang-switch-container { position: absolute; top: 10px; left: 10px; z-index: 100; }
        .lang-switch-container select { padding: 4px; font-size: 12px; border-radius: 4px; cursor: pointer; background-color: #f1f3f5; border: 1px solid #ccc; font-weight: bold; }

       /* 測試模式按鈕與時間模擬器面板 */
        .test-control-panel { position: absolute; top: 10px; right: 10px; z-index: 100; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; max-width: 220px; }
        .test-mode-btn { padding: 4px 8px; font-size: 11px; background-color: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; opacity: 0.8; }
        .test-mode-btn:hover { background-color: #5a6268; opacity: 1; }
        .test-mode-btn.active { background-color: #28a745; opacity: 1; }
        .test-mode-btn.active:hover { background-color: #218838; }
        .test-mode-btn:disabled { background-color: #aaa; cursor: not-allowed; opacity: 1;}

        /* 模擬時間設定區塊 */
        #sim-time-box { display: none; background: #ffffff; padding: 10px; border-radius: 6px; border: 1px solid #28a745; box-shadow: 0 4px 10px rgba(0,0,0,0.15); font-size: 12px; width: 210px; text-align: left; }
        #sim-time-box label { font-weight: bold; display: block; margin-bottom: 4px; color: #333; }
        #sim-time-box input { padding: 5px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 6px; width: 100%; }
        #sim-time-box button { width: 100%; padding: 6px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #sim-time-box button:hover { background: #0056b3; }

        #violation-warnings { color: red; font-size: 20px; font-weight: bold; text-align: center; margin-bottom: 20px; margin-top: 35px; min-height: 25px; }
        
        /* 表單區塊 */
        .form-group { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; width: 100%; }
        select, .operator-display, button.submit-btn { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; max-width: 100%; }
        .operator-display { background-color: #e9ecef; font-weight: bold; color: #007bff; display: flex; align-items: center; justify-content: center; border: 1px solid #ccc; }
        
        button.submit-btn { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; width: 100%; max-width: 250px; }
        button.submit-btn:hover { background-color: #0056b3; }
        button.submit-btn:disabled { background-color: #a0c4ff; cursor: not-allowed; }

        /* 管理者區塊樣式 */
        #manager-area { display: none; margin-bottom: 20px; background: #e8f4f8; padding: 20px; border-radius: 8px; border: 1px solid #b8daff; width: 100%; }
        .manager-controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 15px; }

        .status-board-container { margin-top: 30px; width: 100%; }
        .date-selector { text-align: center; margin-bottom: 20px; background: #e9ecef; padding: 15px; border-radius: 8px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px;}
        .date-selector label { font-size: 16px; font-weight: bold; }
        .date-selector input { padding: 8px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; cursor: pointer; }
        
        .equipment-row { display: flex; align-items: center; margin-bottom: 15px; padding: 10px; background: #f9f9f9; border-radius: 5px; width: 100%; }
        .equipment-name { width: 100px; font-weight: bold; font-size: 18px; flex-shrink: 0; white-space: nowrap; }
        
        /* ✅ 電腦版看板微調，確保 10 格放得下 */
        .circles-container { display: flex; justify-content: flex-start; gap: 10px; overflow-x: auto; padding-bottom: 10px; width: 100%; }
        .circle-wrapper { display: flex; flex-direction: column; align-items: center; min-width: 45px; flex-shrink: 0; }
        .circle { width: 26px; height: 26px; border-radius: 50%; background-color: #ccc; margin-bottom: 5px; }
        .circle.green { background-color: #28a745; }
        .circle.yellow { background-color: #ffc107; }
        .circle.pink { background-color: #ff69b4; }
        .circle.red { background-color: #dc3545; }
        
        .time-label { font-size: 12px; color: #555; min-height: 28px; text-align: center; line-height: 1.2; }

        .history-section, .weekly-report-section { margin-top: 20px; overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: center; min-width: 400px; background: white;}
        th, td { border: 1px solid #ddd; padding: 10px; }
        th { background-color: #007bff; color: white; }
        #manager-area th { background-color: #0056b3; }
        tr:nth-child(even) { background-color: #f2f2f2; }

        @media (max-width: 768px) {
            .container { padding: 15px 10px; }
            h1 { font-size: 20px; }
            h2 { font-size: 16px; }
            
            .form-group select, .form-group .operator-display, .manager-controls select, .manager-controls input { width: 45%; flex-grow: 1; text-align: center; font-size: 14px; }
            .form-group select:nth-child(3) { width: 100%; }
            .manager-controls select#manager-query-type { width: 100%; } 
            
            .equipment-row { flex-direction: column; align-items: flex-start; padding: 10px; }
            .equipment-name { width: 100%; margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid #ddd; text-align: left; font-size: 15px; }
            
            /* ✅ 手機版看板大幅優化：縮小圓圈、縮小間距，讓 10 格能完美容納 */
            .circles-container { gap: 3px; justify-content: flex-start; padding-bottom: 5px; }
            .circle-wrapper { min-width: 29px; }
            .circle { width: 18px; height: 18px; margin-bottom: 3px; }
            /* 利用縮放將文字縮小並集中 */
            .time-label { font-size: 10px; transform: scale(0.8); transform-origin: top center; min-height: 22px; line-height: 1.1; }

            .history-section, .weekly-report-section { margin-top: 30px; }
            table { min-width: 100%; font-size: 13px; }
            th, td { padding: 6px 2px; word-break: break-word; }
        }
    </style>
</head>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<!-- LINE 登入遮罩畫面 -->
<div id="login-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: sans-serif;">
    <h2 style="color: #333; margin-bottom: 20px;" data-i18n="app_title">夜班自主檢查系統</h2>
    <p style="color: #666; margin-bottom: 30px;" id="login-hint" data-i18n="req_config">向伺服器請求配置中...</p>
    <button id="loginBtn" onclick="liff.login()" style="display:none; padding: 12px 30px; background-color: #06C755; color: white; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);" data-i18n="line_login">
        使用 LINE 登入
    </button>
</div>

<!-- 首次登入綁定遮罩畫面 -->
<div id="binding-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 9998; flex-direction: column; justify-content: center; align-items: center; font-family: sans-serif;">
    <h2 style="color: #333; margin-bottom: 20px;" data-i18n="bind_title">首次登入帳號綁定</h2>
    <p style="color: #dc3545; font-weight: bold; margin-bottom: 20px;" data-i18n="bind_warn">⚠️ 注意：一經綁定將無法自行更改</p>
    <p style="color: #666; margin-bottom: 15px;" data-i18n="bind_hint">請選擇您的姓名以綁定此 LINE 帳號：</p>
    
    <select id="bind-operator" style="padding: 10px; font-size: 16px; border-radius: 5px; margin-bottom: 20px; width: 250px;">
        <option value="" data-i18n="bind_loading">載入名單中...</option>
    </select>
    
    <button id="bindBtn" onclick="bindLineAccount()" style="padding: 12px 30px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);" data-i18n="bind_btn">
        確認綁定
    </button>
</div>

<div class="container">
    <!-- 語言切換選單 -->
    <div class="lang-switch-container">
        <select id="langSwitch" onchange="changeLanguage(this.value)">
            <option value="zh-TW">繁體中文</option>
            <option value="vi-VN">Tiếng Việt</option>
        </select>
    </div>

    <!-- 測試模式按鈕與模擬時間面板 -->
    <div class="test-control-panel" id="test-panel">
        <button id="testModeBtn" class="test-mode-btn" onclick="toggleTestMode()" data-i18n="test_mode">測試人員模式</button>
        <div id="sim-time-box">
            <label>⏱️ 模擬打單時間：</label>
            <input type="datetime-local" id="sim-time-input">
            <button onclick="applySimulatedTime()">套用模擬時間</button>
        </div>
    </div>
    
    <div id="violation-warnings"></div>

    <h1 data-i18n="main_title">夜班自主檢查確認</h1>
    
    <!-- ✅ 管理者專屬：綜合報表查詢區塊 -->
    <div id="manager-area">
        <h2 style="color: #0056b3; margin-top: 0;" data-i18n="manager_title"> 管理者查詢模式</h2>
        <div class="manager-controls">
            <select id="manager-query-type" onchange="toggleManagerQueryType()">
                <option value="by_date" data-i18n="query_by_date">依日期查詢 (全廠設備)</option>
                <option value="by_equip" data-i18n="query_by_equip">依設備查詢 (一週紀錄)</option>
            </select>
            
            <select id="manager-equip" onchange="renderWeeklyReport()">
                <option value="七*機">七*機</option>
                <option value="角*機">角*機</option>
                <option value="六*機">六*機</option>
                <option value="中**機">中**機</option>
                <option value="台*機">台*機</option>
                <option value="薄*機">薄*機</option>
            </select>
            
            <input type="date" id="manager-date" onchange="renderWeeklyReport()">
        </div>
        <div class="weekly-report-section">
            <table>
                <thead>
                    <tr>
                        <th data-i18n="col_date">日期</th>
                        <th data-i18n="col_equip">設備</th>
                        <th data-i18n="col_night_count">自檢次數</th>
                        <th data-i18n="col_result">結果</th>
                    </tr>
                </thead>
                <tbody id="weekly-report-body">
                </tbody>
            </table>
        </div>
    </div>

    <!-- 一般人員：打單區塊 -->
    <div id="operator-area">
        <div class="form-group">
            <div id="operator-display" class="operator-display" data-i18n="data_loading">
                資料載入中...
            </div>

            <select id="equipment">
                <option value="" data-i18n="select_equip">-- 選擇設備 --</option>
                <option value="七*機">七*機</option>
                <option value="角*機">角*機</option>
                <option value="六*機">六*機</option>
                <option value="中**機">中**機</option>
                <option value="台*機">台*機</option>
                <option value="薄*機">薄*機</option>
            </select>

            <select id="status">
                <option value="" data-i18n="select_status">-- 選擇品質狀態 --</option>
                <option value="品質正常" data-i18n="status_normal">品質正常</option>
                <option value="可收板,但須微調" data-i18n="status_adjust">可收板,但須微調</option>
                <option value="須暫停收板,調整" data-i18n="status_pause">須暫停收板,調整</option>
                <option value="需要停機調整" data-i18n="status_stop">需要停機調整</option>
            </select>

            <button id="submitBtn" class="submit-btn" onclick="submitInspection()" data-i18n="submit_btn">自主檢查確認</button>
        </div>
    </div>

    <div class="status-board-container">
        <div class="date-selector">
            <label for="view-date" data-i18n="query_date">查詢特定日期設備狀態：</label>
            <input type="date" id="view-date" onchange="renderStatusBoard()">
        </div>
        <div id="status-board">
            <h2 data-i18n="board_loading">載入雲端資料中...請稍候</h2>
        </div>
    </div>

    <div class="history-section">
        <h2 data-i18n="history_title">近 50 筆自主檢查紀錄</h2>
        <table>
            <thead>
                <tr>
                    <th data-i18n="col_time">時間</th>
                    <th data-i18n="col_operator">人員</th>
                    <th data-i18n="col_equip">設備</th>
                    <th data-i18n="col_status">品質狀態</th>
                </tr>
            </thead>
            <tbody id="history-body">
            </tbody>
        </table>
    </div>
</div>

    let currentLang = localStorage.getItem('appLang') || 'zh-TW';
    document.getElementById('langSwitch').value = currentLang;

    function t(key) {
        return i18n[currentLang][key] || key;
    }

    function changeLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('appLang', lang);
        applyTranslations();
        updateUI(); 
    }

    function applyTranslations() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (el.tagName === 'INPUT' && el.type === 'button') {
                el.value = t(key);
            } else {
                el.innerText = t(key);
            }
        });
        
        const statusSelect = document.getElementById("status");
        statusSelect.options[0].innerText = t("select_status");
        statusSelect.options[1].innerText = t("status_normal");
        statusSelect.options[2].innerText = t("status_adjust");
        statusSelect.options[3].innerText = t("status_pause");
        statusSelect.options[4].innerText = t("status_stop");

        const bindSelect = document.getElementById("bind-operator");
        if(bindSelect && bindSelect.options.length > 0 && bindSelect.value === "") {
            bindSelect.options[0].innerText = t("bind_select_default");
        }

        if(currentUser) {
            document.getElementById("operator-display").innerText = "👤 " + maskName(currentUser);
        }
        
        const btn = document.getElementById("testModeBtn");
        if(isTestMode) {
            btn.innerText = t("test_mode_on");
        } else {
            btn.innerText = t("test_mode");
        }
    }

    function translateStatus(statusText) {
        if (statusText === "品質正常") return t("status_normal");
        if (statusText === "可收板,但須微調") return t("status_adjust");
        if (statusText === "須暫停收板,調整") return t("status_pause");
        if (statusText === "需要停機調整") return t("status_stop");
        return statusText;
    }

    // ========================================================

    function formatDateWithDay(dateObj) {
        const yyyy = dateObj.getFullYear();
        const mm = dateObj.getMonth() + 1;
        const dd = dateObj.getDate();
        const days = ['日', '一', '二', '三', '四', '五', '六'];
        const dayStr = days[dateObj.getDay()];
        return `${yyyy}/${mm}/${dd}(${dayStr})`;
    }

    function maskName(name) {
        if (!name || name.length <= 1) return name || "";
        return name.charAt(0) + "O" + name.substring(2);
    }

    async function toggleTestMode() {
        const btn = document.getElementById("testModeBtn");
        const simBox = document.getElementById("sim-time-box");

        if (isTestMode) {
            isTestMode = false;
            simulatedTime = null; 
            simBox.style.display = "none";
            btn.innerText = t("test_mode");
            btn.classList.remove("active");
            alert(t("msg_test_off"));
            updateUI(); 
        } else {
            const pwd = prompt(t("msg_test_pwd"));
            if (pwd !== null && pwd !== "") {
                btn.innerText = t("msg_test_verifying");
                btn.disabled = true;
                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'verify_password', password: pwd })
                    });
                    const data = await res.json();
                    
                    if (data.result === "success") {
                        isTestMode = true;
                        btn.innerText = t("test_mode_on");
                        btn.classList.add("active");
                        simBox.style.display = "block"; 
                        
                        const now = new Date();
                        const pad = n => String(n).padStart(2, '0');
                        document.getElementById("sim-time-input").value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;

                        alert(t("msg_test_on"));
                        updateUI(); 
                    } else {
                        alert(t("msg_pwd_err"));
                        btn.innerText = t("test_mode");
                    }
                } catch (error) {
                    alert(t("msg_net_err"));
                    btn.innerText = t("test_mode");
                } finally {
                    btn.disabled = false;
                }
            }
        }
    }

    function initDatePicker() {
        const date = getCurrentTime();
        if (date.getHours() >= 8) { date.setDate(date.getDate()); }
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        document.getElementById("view-date").value = `${yyyy}-${mm}-${dd}`;
        document.getElementById("manager-date").value = `${yyyy}-${mm}-${dd}`;
    }

    function getLastRecord(equip) {
        let equipRecords = records.filter(r => r.equipment === equip);
        return equipRecords.length > 0 ? equipRecords[equipRecords.length - 1] : null;
    }

    // 載入資料
    async function loadData() {
        try {
            const response = await fetch(SCRIPT_URL + "?lineId=" + currentLineId);
            const data = await response.json();
            
            records = data.records || [];

            if (data.currentUser) {
                currentUser = data.currentUser;
                document.getElementById("operator-display").innerText = "👤 " + maskName(currentUser);
                document.getElementById("login-overlay").style.display = "none";
                document.getElementById("binding-overlay").style.display = "none";
                
                if (managerList.includes(currentUser)) {
                    document.getElementById("operator-area").style.display = "none";
                    document.getElementById("manager-area").style.display = "block";
                    document.getElementById("test-panel").style.display = "none"; 
                } else {
                    document.getElementById("operator-area").style.display = "block";
                    document.getElementById("manager-area").style.display = "none";
                }

                updateUI();
            } else {
                document.getElementById("login-overlay").style.display = "none";
                
                const boundNames = data.boundNames || [];
                const availableOperators = allOperators.filter(name => !boundNames.includes(name));
                
                const bindSelect = document.getElementById("bind-operator");
                bindSelect.innerHTML = `<option value="">${t('bind_select_default')}</option>`;
                
                if (availableOperators.length === 0) {
                    bindSelect.innerHTML = `<option value="">${t('bind_empty')}</option>`;
                } else {
                    availableOperators.forEach(name => {
                        const opt = document.createElement("option");
                        opt.value = name; 
                        opt.innerText = maskName(name); 
                        bindSelect.appendChild(opt);
                    });
                }
                document.getElementById("binding-overlay").style.display = "flex";
            }
        } catch (error) {
            console.error("載入失敗", error);
            alert(t("msg_net_err"));
        }
    }

    // 執行首次綁定
    async function bindLineAccount() {
        const selectedName = document.getElementById("bind-operator").value; 
        if (!selectedName) {
            alert(t("msg_alert_name"));
            return;
        }
        
        const btn = document.getElementById("bindBtn");
        btn.innerText = t("msg_binding");
        btn.disabled = true;
        
        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'bind',
                    lineId: currentLineId,
                    name: selectedName
                })
            });
            
            alert(t("msg_bind_success") + maskName(selectedName));
            
            currentUser = selectedName;
            document.getElementById("operator-display").innerText = "👤 " + maskName(currentUser);
            document.getElementById("binding-overlay").style.display = "none";
            
            if (managerList.includes(currentUser)) {
                document.getElementById("operator-area").style.display = "none";
                document.getElementById("manager-area").style.display = "block";
                document.getElementById("test-panel").style.display = "none";
            } else {
                document.getElementById("operator-area").style.display = "block";
                document.getElementById("manager-area").style.display = "none";

            console.error("綁定失敗", error);
            alert(t("msg_bind_fail"));
            btn.innerText = t("bind_btn");
            btn.disabled = false;

    }

    // 提交自主檢查確認
    async function submitInspection() {
        const now = getCurrentTime(); 

        const equipment = document.getElementById("equipment").value;
        const status = document.getElementById("status").value;

        if (!currentUser || !equipment || !status) {
            alert(t("msg_missing_item"));
            return;
        }

        if (!isTestMode) {
            if (equipment === "薄*機") {
                // 薄板機 08:00 到 19:59 禁止打單
                if (now.getHours() >= 8 && now.getHours() < 20) {
                    alert("薄*機可打單時間為晚上 20:00 到早上 08:00！");
                    return;
                }
            } else {
                // 一般機台 08:00 以後禁止打單
                if (now.getHours() >= 8) {
                    alert(t("msg_not_night"));
                    return;
                }
            }
        }

        const lastRecord = getLastRecord(equipment);

        if (!isTestMode && lastRecord) {
            const lastTime = new Date(lastRecord.timestamp);
            const diffHours = (now - lastTime) / (1000 * 30 * 60);

            if (diffHours < 1) {
                const timeString = lastTime.toLocaleTimeString('zh-TW', { hour12: false });
                alert(t("msg_time_limit") + timeString);
                return;
            }
        }

        const newRecord = {
            action: 'inspect', 
            timestamp: now.getTime(),
            date: now.toLocaleDateString('zh-TW'),
            operator: currentUser, 
            equipment: equipment,
            status: status
        };

        const btn = document.getElementById("submitBtn");
        btn.innerText = t("msg_submitting");
        btn.disabled = true;

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(newRecord)
            });

            records.push(newRecord);
            updateUI();

            document.getElementById("equipment").value = "";
            document.getElementById("status").value = "";

            alert(t("msg_submit_ok"));
        } catch (error) {
            console.error("上傳失敗", error);
            alert(t("msg_submit_fail"));
        } finally {
            btn.innerText = t("submit_btn");
            btn.disabled = false;
        }
    }

    function updateUI() {
        renderStatusBoard();
        renderHistory();
        renderWeeklyReport();
        checkDailyAudit();
    }

    // ✅ 【核心引擎】：精準劃分每個設備的「專屬班別時段」
    function isRecordInShift(rTimestamp, targetDateObj, equip) {
        let rTime = new Date(rTimestamp).getTime();
        
        if (equip === "薄*機") {
            // 薄板機的 1 個夜班 = 目標日前一天的 20:00 到 目標日當天的 08:00
            let shiftStart = new Date(targetDateObj.getFullYear(), targetDateObj.getMonth(), targetDateObj.getDate() - 1, 20, 0, 0).getTime();
            let shiftEnd = new Date(targetDateObj.getFullYear(), targetDateObj.getMonth(), targetDateObj.getDate(), 8, 0, 0).getTime();
            return rTime >= shiftStart && rTime < shiftEnd;
        } else {
            // 一般機台：純比對該日期當天的 00:00 到 23:59 (依原全天邏輯)
            let rDate = new Date(rTimestamp);
            return (rDate.getFullYear() === targetDateObj.getFullYear() && 
                    rDate.getMonth() === targetDateObj.getMonth() && 
                    rDate.getDate() === targetDateObj.getDate());
        }
    }

    function toggleManagerQueryType() {
        const queryType = document.getElementById("manager-query-type").value;
        const equipSelect = document.getElementById("manager-equip");
        
        if (queryType === "by_date") {
            equipSelect.style.display = "none"; 
        } else {
            equipSelect.style.display = "inline-block"; 
        }
        renderWeeklyReport();
    }

    function getStatusHtml(count, isWeekend, requiredCount) {
        if (count >= requiredCount) {
            return `<span style='color: #28a745; font-weight: bold;'>${t("status_ok")}</span>`;
        } 
        else if (isWeekend) {
            return `<span style='color: #aaa; font-weight: bold;'>${t("status_holiday")}</span>`;
        } 
        else if (count === 0) {
            return `<span style='color: #6c757d; font-weight: bold;'>${t("status_none")}</span>`;
        } 
        else {
            return `<span style='color: #dc3545; font-weight: bold;'>${t("status_fail")}</span>`;
        }
    }

    function renderWeeklyReport() {
        if (!managerList.includes(currentUser)) return;

        const tbody = document.getElementById("weekly-report-body");
        tbody.innerHTML = "";
        
        const queryType = document.getElementById("manager-query-type").value;
        const equip = document.getElementById("manager-equip").value;
        const dateInput = document.getElementById("manager-date").value;
        if (!dateInput) return;
        
        let [y, m, d] = dateInput.split('-');
        let baseDate = new Date(y, m - 1, d);

        if (queryType === "by_equip") {
            let requiredCount = (equip === "薄*機") ? 7 : 5; 
            
            for (let i = 6; i >= 0; i--) {
                let targetDate = new Date(baseDate);
                targetDate.setDate(targetDate.getDate() - i);
                
                let dayRecords = records.filter(r => r.equipment === equip && isRecordInShift(r.timestamp, targetDate, equip));
                let count = dayRecords.length;
                
                let dayOfWeek = targetDate.getDay();
                let isWeekend = false;
                if (equip === "薄*機") {
                    isWeekend = (dayOfWeek === 6 || dayOfWeek === 0 || dayOfWeek === 1);
                } else {
                    isWeekend = (dayOfWeek === 0 || dayOfWeek === 1); 
                }
                
                let statusHtml = getStatusHtml(count, isWeekend, requiredCount);
                
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${formatDateWithDay(targetDate)}</td>
                    <td>${equip}</td>
                    <td style="font-weight: bold; font-size: 16px; color: ${count >= requiredCount ? '#28a745' : '#333'};">${count}</td>
                    <td>${statusHtml}</td>
                `;
                tbody.appendChild(tr);
            }
        } 
        else {
            equipments.forEach(eq => {
                let requiredCount = (eq === "薄*機") ? 7 : 5;
                
                let eqRecords = records.filter(r => r.equipment === eq && isRecordInShift(r.timestamp, baseDate, eq));
                let count = eqRecords.length;
                
                let dayOfWeek = baseDate.getDay();
                let isWeekend = false;
                if (eq === "薄*機") {
                    isWeekend = (dayOfWeek === 6 || dayOfWeek === 0 || dayOfWeek === 1);
                } else {
                    isWeekend = (dayOfWeek === 0 || dayOfWeek === 1);
                }
                
                let statusHtml = getStatusHtml(count, isWeekend, requiredCount);
                
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${formatDateWithDay(baseDate)}</td>
                    <td>${eq}</td>
                    <td style="font-weight: bold; font-size: 16px; color: ${count >= requiredCount ? '#28a745' : '#333'};">${count}</td>
                    <td>${statusHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    }

    function renderStatusBoard() {
        const board = document.getElementById("status-board");
        board.innerHTML = ""; 
        const viewDateInput = document.getElementById("view-date").value;
        let targetObj, displayTitleDate;

        if (viewDateInput) {
            let [y, m, d] = viewDateInput.split('-');
            targetObj = new Date(y, m - 1, d);
            displayTitleDate = formatDateWithDay(targetObj);
        } else {
            targetObj = getCurrentTime();
            displayTitleDate = t("today") + ` (${formatDateWithDay(targetObj)})`;
        }

        const title = document.createElement("h2");
        title.innerText = `${displayTitleDate} ${t("board_title_suffix")} (依該設備班別)`;
        board.appendChild(title);

        equipments.forEach(equip => {
            let targetRecords = records.filter(r => r.equipment === equip && isRecordInShift(r.timestamp, targetObj, equip));

            const row = document.createElement("div");
            row.className = "equipment-row";
            const nameDiv = document.createElement("div");
            nameDiv.className = "equipment-name";
            nameDiv.innerText = equip;
            row.appendChild(nameDiv);

            const circlesDiv = document.createElement("div");
            circlesDiv.className = "circles-container";

            // ✅ 將看板預設強制調整為 10 格，若大於 10 格會自動延伸
            let maxCircles = Math.max(10, targetRecords.length);

            for (let i = 0; i < maxCircles; i++) {
                const wrapper = document.createElement("div");
                wrapper.className = "circle-wrapper";
                const circle = document.createElement("div");
                circle.className = "circle";
                const timeLabel = document.createElement("div");
                timeLabel.className = "time-label";

                if (i < targetRecords.length) {
                    const rec = targetRecords[i];
                    let rTime = new Date(rec.timestamp);
                    let timeStr = rTime.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
                    
                    let shortName = maskName(rec.operator).substring(0, 3);
                    
                    timeLabel.innerHTML = `${timeStr}<br><span style="color: #007bff; font-weight: bold;">${shortName}</span>`;

                    if (rec.status === "品質正常") circle.classList.add("green");
                    else if (rec.status === "可收板,但須微調") circle.classList.add("yellow");
                    else if (rec.status === "須暫停收板,調整") circle.classList.add("pink");
                    else if (rec.status === "需要停機調整") circle.classList.add("red");
                }
                wrapper.appendChild(circle);
                wrapper.appendChild(timeLabel);
                circlesDiv.appendChild(wrapper);
            }
            row.appendChild(circlesDiv);
            board.appendChild(row);
        });
    }

    function renderHistory() {
        const tbody = document.getElementById("history-body");
        tbody.innerHTML = "";
        const recentRecords = [...records].reverse().slice(0, 50);

        recentRecords.forEach(rec => {
            const tr = document.createElement("tr");
            const rTime = new Date(rec.timestamp).toLocaleString('zh-TW', { hour12: false });

            let statusColor = "#000";
            if (rec.status === "需要停機調整") statusColor = "red";
            else if (rec.status === "須暫停收板,調整") statusColor = "#ff69b4";
            else if (rec.status === "可收板,但須微調") statusColor = "#d39e00";
            else if (rec.status === "品質正常") statusColor = "green";

            tr.innerHTML = `
                <td>${rTime}</td>
                <td>${maskName(rec.operator)}</td> 
                <td>${rec.equipment}</td>
                <td style="color: ${statusColor}; font-weight: bold;">${translateStatus(rec.status)}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function checkDailyAudit() {
        const warningDiv = document.getElementById("violation-warnings");
        warningDiv.innerHTML = "";

        const now = getCurrentTime(); 
        if (!isTestMode && (now.getHours() < 8 || (now.getHours() === 8 && now.getMinutes() < 20))) return;

        const todayStr = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()}`; 

        equipments.forEach(equip => {
            let requiredCount = (equip === "薄*機") ? 7 : 5; 
            
            let dayOfWeek = now.getDay();
            let isWeekend = false;
            if (equip === "薄*機") {
                isWeekend = (dayOfWeek === 6 || dayOfWeek === 0 || dayOfWeek === 1);
            } else {
                isWeekend = (dayOfWeek === 0 || dayOfWeek === 1);
            }

            if (!isTestMode && isWeekend) return; 

            let targetRecords = records.filter(r => r.equipment === equip && isRecordInShift(r.timestamp, now, equip));

            if (targetRecords.length > 0) {
                let isViolation = (targetRecords.length < requiredCount);

                if (isViolation) {
                    targetRecords.sort((a, b) => a.timestamp - b.timestamp);
                    let violationOperator = targetRecords[targetRecords.length - 1].operator;
                    const msg = document.createElement("div");
                    msg.style.color = "red";
                    msg.innerText = `${equip} ${maskName(violationOperator)} ${todayStr} 檢查次數未達 ${requiredCount} 次，請確實實施`;
                    warningDiv.appendChild(msg);
                }
            }
            // Removed the else block that displays the 0 count violation message
        });
    }

    // 初始化與啟動
    window.onload = async function() {
        applyTranslations(); 
        
        try {
            document.getElementById("login-hint").innerText = t("req_config");
            
            const configRes = await fetch(SCRIPT_URL + "?action=getConfig");
            const config = await configRes.json();
            DYNAMIC_LIFF_ID = config.liffId;

            document.getElementById("login-hint").innerText = t("verifying");
            
            await liff.init({ liffId: DYNAMIC_LIFF_ID });
            
            if (liff.isLoggedIn()) {
                const profile = await liff.getProfile();
                currentLineId = profile.userId;
                
                initDatePicker();
                await loadData();
            } else {
                document.getElementById("login-hint").innerText = t("verify_hint");
                document.getElementById("loginBtn").style.display = "block";
            }
        } catch (error) {
            console.error("初始化失敗", error);
            document.getElementById("login-hint").innerText = t("config_fail");
        }
    };

    setInterval(checkDailyAudit, 60000);
    setInterval(loadData, 60000); // 每 60 秒自動從雲端同步最新打單紀錄
</script>
